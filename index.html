<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中化學：化學平衡正式全卷測驗</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --gray-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--gray-bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      color: #1e3a8a;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }
    .student-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .info-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 180px;
    }
    .info-group label {
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    .info-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    .info-group input:disabled {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }
    .status-bar {
      position: sticky;
      top: 15px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .status-info {
      font-size: 1rem;
      font-weight: 600;
    }
    .status-score {
      color: var(--primary);
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .q-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 16px;
    }
    .q-type {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
    }
    .locked-badge {
      display: inline-block;
      background: #fee2e2;
      color: #991b1b;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-label {
      display: flex;
      align-items: flex-start;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-label:hover {
      background: var(--primary-light);
      border-color: #93c5fd;
    }
    .option-label.disabled {
      cursor: not-allowed;
      background: #f1f5f9;
      opacity: 0.85;
      border-color: #cbd5e1;
    }
    .option-label input {
      margin-top: 5px;
      margin-right: 12px;
      transform: scale(1.15);
    }
    .btn-submit-q {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
    }
    .result-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .result-correct {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .result-wrong {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .explanation {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #334155;
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
    }
    .upload-banner {
      display: none;
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 50px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    sub, sup {
      font-size: 75%;
      line-height: 0;
      position: relative;
      vertical-align: baseline;
    }
    sub { bottom: -0.25em; }
    sup { top: -0.5em; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🧪 高中化學：化學平衡正式全卷測驗</h1>
      <p class="subtitle">共 20 題 ｜ ⚠️ 請先填妥班級、座號、姓名。每題作答後即鎖定並即時解析，全卷完成自動上傳成績。</p>
    </header>

    <div class="student-card">
      <div class="info-group">
        <label for="studentClass">班級：</label>
        <input type="text" id="studentClass" placeholder="例如：高二甲班">
      </div>
      <div class="info-group">
        <label for="studentSeat">座號：</label>
        <input type="text" id="studentSeat" placeholder="例如：12">
      </div>
      <div class="info-group">
        <label for="studentName">姓名：</label>
        <input type="text" id="studentName" placeholder="請輸入姓名">
      </div>
    </div>

    <div class="status-bar">
      <div class="status-info">已完成：<span id="answeredCount">0</span> / <span id="totalCount">20</span> 題</div>
      <div class="status-info status-score">目前得分：<span id="scoreText">0</span> 分</div>
    </div>

    <form id="quizForm">
      <div id="questionsContainer"></div>
    </form>

    <div id="uploadBanner" class="upload-banner"></div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxL8aghmYIWUVNeQRD9-4bXDAIVTZjd-5afQLoe1irKaFBM6VjTPE6yHvi-7PVTL6q/exec";

    // 完整 20 題已修正化學符號上標與下標
    const quizData = [
      {
        id: 1,
        title: "25 ℃ 時，2Cl(g) ⇌ Cl<sub>2</sub>(g) 之 <i>K</i><sub>c</sub>＝1 × 10<sup>38</sup>，若原有 [Cl]＝1 M，則平衡時 Cl<sub>2</sub> 之濃度為多少 M？",
        type: "single",
        options: [
          { key: "A", text: "0.1" },
          { key: "B", text: "0.5" },
          { key: "C", text: "1" },
          { key: "D", text: "10<sup>-38</sup>" }
        ],
        answer: ["B"],
        explanation: "由 2Cl(g) ⇌ Cl<sub>2</sub>(g) 之 <i>K</i><sub>c</sub> 值極大，可知此反應向右進行非常完全，故平衡時 [Cl<sub>2</sub>] ≈ 0.5 M。"
      },
      {
        id: 2,
        title: "氫和碘蒸氣各 1.6 mol 於 2.0 L 容器中反應生成碘化氫，若 350 ℃ 時的平衡常數為 36.0，則平衡時有關各反應物及產物的濃度，哪些是正確的？",
        type: "multiple",
        options: [
          { key: "A", text: "[H<sub>2</sub>]＝0.1 M" },
          { key: "B", text: "[I<sub>2</sub>]＝0.2 M" },
          { key: "C", text: "[HI]＝1.2 M" },
          { key: "D", text: "[H<sub>2</sub>]＝1.2 M" },
          { key: "E", text: "[HI]＝0.2 M" }
        ],
        answer: ["B", "C"],
        explanation: "初濃度 [H<sub>2</sub>]＝[I<sub>2</sub>]＝1.6 / 2.0＝0.8 M。反應式 H<sub>2</sub> ＋ I<sub>2</sub> ⇌ 2HI，平衡時 [H<sub>2</sub>]＝[I<sub>2</sub>]＝0.8－x，[HI]＝2x。(2x)<sup>2</sup> / (0.8－x)<sup>2</sup> ＝ 36 ⇒ 2x / (0.8－x) ＝ 6 ⇒ x ＝ 0.6。故平衡時 [H<sub>2</sub>]＝[I<sub>2</sub>]＝0.2 M，[HI]＝1.2 M。"
      },
      {
        id: 3,
        title: "下列各平衡系中，何者的平衡常數會隨溫度升高而變大？",
        type: "multiple",
        options: [
          { key: "A", text: "N<sub>2</sub>O<sub>4</sub>(g) ⇌ 2NO<sub>2</sub>(g)" },
          { key: "B", text: "Cl<sub>2</sub>(g) ⇌ 2Cl(g)" },
          { key: "C", text: "N<sub>2</sub>(g) ＋ 3H<sub>2</sub>(g) ⇌ 2NH<sub>3</sub>(g)" },
          { key: "D", text: "H<sup>+</sup>(aq) ＋ OH<sup>-</sup>(aq) ⇌ H<sub>2</sub>O(l)" },
          { key: "E", text: "NaNO<sub>3</sub>(s) ⇌ NaNO<sub>2</sub>(s) ＋ 1/2 O<sub>2</sub>(g)" }
        ],
        answer: ["A", "B", "E"],
        explanation: "對吸熱反應（ΔH ＞ 0）而言，升高溫度平衡向吸熱方向移動，平衡常數增大。(A)(B)(E)均為吸熱分解反應；(C)哈柏法製氨為放熱反應；(D)酸鹼中和為放熱反應。"
      },
      {
        id: 4,
        title: "A<sub>2</sub>B<sub>4</sub> ⇌ 2AB<sub>2</sub> 的反應熱為 ΔH，平衡常數為 <i>K</i>，在同溫時，反應 AB<sub>2</sub> ⇌ 1/2 A<sub>2</sub>B<sub>4</sub>，反應熱（ΔH'）及平衡常數（<i>K'</i>）應各為何？",
        type: "multiple",
        options: [
          { key: "A", text: "<i>K'</i>＝1 / <i>K</i>" },
          { key: "B", text: "ΔH'＝ΔH" },
          { key: "C", text: "ΔH'＝-1/2 ΔH" },
          { key: "D", text: "<i>K'</i>＝<i>K</i>" },
          { key: "E", text: "(<i>K'</i>)<sup>2</sup>＝1 / <i>K</i>" }
        ],
        answer: ["C", "E"],
        explanation: "目標反應為原反應逆向並乘以 1/2。因此 ΔH' ＝ -1/2 ΔH，<i>K'</i> ＝ (1 / <i>K</i>)<sup>1/2</sup>，即 (<i>K'</i>)<sup>2</sup> ＝ 1 / <i>K</i>。"
      },
      {
        id: 5,
        title: "下列有關平衡常數表示式的敘述中，何者不正確？",
        type: "multiple",
        options: [
          { key: "A", text: "Hg<sub>2</sub>Cl<sub>2</sub>(s) 之 <i>K</i><sub>sp</sub>＝[Hg<sup>+</sup>]<sup>2</sup>[Cl<sup>-</sup>]<sup>2</sup>" },
          { key: "B", text: "NH<sub>3</sub>(aq) ＋ H<sub>2</sub>O(l) ⇌ NH<sub>4</sub><sup>+</sup>(aq) ＋ OH<sup>-</sup>(aq) 之 <i>K</i><sub>c</sub>＝([NH<sub>4</sub><sup>+</sup>][OH<sup>-</sup>]) / ([NH<sub>3</sub>][H<sub>2</sub>O])" },
          { key: "C", text: "2HgO(s) ⇌ 2Hg(l) ＋ O<sub>2</sub>(g) 之 <i>K</i><sub>c</sub>＝[O<sub>2</sub>]" },
          { key: "D", text: "CO(g) ＋ 3H<sub>2</sub>(g) ⇌ CH<sub>4</sub>(g) ＋ H<sub>2</sub>O(g) 之 <i>K</i><sub>c</sub>＝([CH<sub>4</sub>][H<sub>2</sub>O]) / ([CO][H<sub>2</sub>])" },
          { key: "E", text: "C<sub>2</sub>H<sub>5</sub>OH(l) ⇌ C<sub>2</sub>H<sub>5</sub>OH(g) 之 <i>K</i><sub>c</sub>＝1 / [C<sub>2</sub>H<sub>5</sub>OH(g)]" }
        ],
        answer: ["A", "B", "D", "E"],
        explanation: "(A) Hg<sub>2</sub>Cl<sub>2</sub>(s) ⇌ Hg<sub>2</sub><sup>2+</sup>(aq) ＋ 2Cl<sup>-</sup>(aq)，<i>K</i><sub>sp</sub>＝[Hg<sub>2</sub><sup>2+</sup>][Cl<sup>-</sup>]<sup>2</sup>；(B) 水為溶劑不列入，<i>K</i><sub>c</sub>＝[NH<sub>4</sub><sup>+</sup>][OH<sup>-</sup>] / [NH<sub>3</sub>]；(D) 應為 <i>K</i><sub>c</sub>＝([CH<sub>4</sub>][H<sub>2</sub>O]) / ([CO][H<sub>2</sub>]<sup>3</sup>)；(E) 應為 <i>K</i><sub>c</sub>＝[C<sub>2</sub>H<sub>5</sub>OH(g)]。"
      },
      {
        id: 6,
        title: "下列平衡系，何者 <i>K</i><sub>p</sub> 與 <i>K</i><sub>c</sub> 之數值與單位無關（即 <i>K</i><sub>p</sub> ＝ <i>K</i><sub>c</sub>）？",
        type: "multiple",
        options: [
          { key: "A", text: "CO(g) ＋ 1/2 O<sub>2</sub>(g) ⇌ CO<sub>2</sub>(g)" },
          { key: "B", text: "C<sub>2</sub>H<sub>4</sub>(g) ＋ H<sub>2</sub>(g) ⇌ C<sub>2</sub>H<sub>6</sub>(g)" },
          { key: "C", text: "H<sub>2</sub>(g) ＋ F<sub>2</sub>(g) ⇌ 2HF(g)" },
          { key: "D", text: "N<sub>2</sub>(g) ＋ 3F<sub>2</sub>(g) ⇌ 2NF<sub>3</sub>(g)" },
          { key: "E", text: "H<sub>2</sub>O(g) ＋ CO(g) ⇌ H<sub>2</sub>(g) ＋ CO<sub>2</sub>(g)" }
        ],
        answer: ["C", "E"],
        explanation: "<i>K</i><sub>p</sub> ＝ <i>K</i><sub>c</sub>(RT)<sup>Δn</sup>，當氣體反應前後莫耳數差 Δn ＝ 0 時，<i>K</i><sub>p</sub> ＝ <i>K</i><sub>c</sub> 且與單位無關。(C) Δn ＝ 2 － (1＋1) ＝ 0；(E) Δn ＝ (1＋1) － (1＋1) ＝ 0。"
      },
      {
        id: 7,
        title: "定溫下，當 A(aq) ＋ 3B(aq) ⇌ 2C(aq) 達平衡時，下列敘述何者正確？",
        type: "multiple",
        options: [
          { key: "A", text: "A、B、C 三者濃度皆維持不變" },
          { key: "B", text: "正反應速率＝逆反應速率＝0" },
          { key: "C", text: "A 的消耗速率＝B 的消耗速率＝C 的生成速率" },
          { key: "D", text: "A、B、C 的莫耳數比 n<sub>A</sub>：n<sub>B</sub>：n<sub>C</sub>＝1：3：2" },
          { key: "E", text: "[C]<sup>2</sup> / ([A][B]<sup>3</sup>) 為定值" }
        ],
        answer: ["A", "E"],
        explanation: "平衡時為動態平衡，正逆反應速率相等且不為 0；各物質濃度維持不變；反應商等於平衡常數為定值；反應變化量才遵守係數比，現存莫耳數不一定為係數比。"
      },
      {
        id: 8,
        title: "在 1000 K 時，反應 CaCO<sub>3</sub>(s) ⇌ CaO(s) ＋ CO<sub>2</sub>(g) 達平衡時 P<sub>CO<sub>2</sub></sub>＝0.04 atm；同溫時，C(s) ＋ CO<sub>2</sub>(g) ⇌ 2CO(g) 之 <i>K</i><sub>p</sub>＝1.96 atm。若將足量 C(s)、CaO(s) 和 CaCO<sub>3</sub>(s) 置於密閉容器，於 1000 K 達平衡時，下列何者正確？",
        type: "multiple",
        options: [
          { key: "A", text: "P<sub>CO<sub>2</sub></sub> ＜ 0.04 atm" },
          { key: "B", text: "P<sub>CO</sub>＝0.28 atm" },
          { key: "C", text: "C(s) 的量較開始反應時少" },
          { key: "D", text: "CaO(s) 的量較開始反應時少" },
          { key: "E", text: "CaCO<sub>3</sub>(s) 的量較開始反應時少" }
        ],
        answer: ["B", "C", "E"],
        explanation: "足量 CaCO<sub>3</sub> 與 CaO 存在時 P<sub>CO<sub>2</sub></sub> 恆等於 0.04 atm。(P<sub>CO</sub>)<sup>2</sup> / 0.04 ＝ 1.96 ⇒ P<sub>CO</sub> ＝ 0.28 atm。反應進行消耗 C 與 CaCO<sub>3</sub> 生成 CaO 與 CO。"
      },
      {
        id: 9,
        title: "下列平衡系中，各物質的濃度或壓力單位，不論以 mol L<sup>-1</sup> 或 mmHg 表示，其平衡常數的數值均相同的為何？",
        type: "multiple",
        options: [
          { key: "A", text: "2SO<sub>2</sub>(g) ＋ O<sub>2</sub>(g) ⇌ 2SO<sub>3</sub>(g)" },
          { key: "B", text: "PCl<sub>5</sub>(g) ⇌ PCl<sub>3</sub>(g) ＋ Cl<sub>2</sub>(g)" },
          { key: "C", text: "H<sub>2</sub>(g) ＋ I<sub>2</sub>(g) ⇌ 2HI(g)" },
          { key: "D", text: "N<sub>2</sub>(g) ＋ 2O<sub>2</sub>(g) ⇌ 2NO<sub>2</sub>(g)" },
          { key: "E", text: "CH<sub>4</sub>(g) ＋ 2O<sub>2</sub>(g) ⇌ CO<sub>2</sub>(g) ＋ 2H<sub>2</sub>O(g)" }
        ],
        answer: ["C", "E"],
        explanation: "當氣體生成物係數和等於反應物係數和（Δn ＝ 0）時，平衡常數為無因次量，數值不受單位換算影響。"
      },
      {
        id: 10,
        title: "某反應：aA(s) ＋ bB(g) ⇌ cC(g) 達到平衡時，溫度升高時 C 的體積百分率下降；在同溫下壓力 P<sub>1</sub> ＞ P<sub>2</sub> 時，高壓 P<sub>1</sub> 的 C 體積百分率較大。由此可判斷何者正確？",
        type: "multiple",
        options: [
          { key: "A", text: "此為放熱反應" },
          { key: "B", text: "此為吸熱反應" },
          { key: "C", text: "a ＋ b ＜ c" },
          { key: "D", text: "a ＋ b ＞ c" },
          { key: "E", text: "b ＞ c" }
        ],
        answer: ["A", "D", "E"],
        explanation: "升溫使 C 含量下降，代表正反應為放熱反應；加壓使平衡向氣體分子數減少方向移動，高壓下 C% 提高代表 b ＞ c。因 a 為固體，故亦有 a ＋ b ＞ c。"
      },
      {
        id: 11,
        title: "設 A(g) ＋ B(g) ⇌ 3C(g) 於 25 ℃ 時 <i>K</i><sub>c</sub>＝2，則在該溫度下 5 L 之容器中各置入下列物質，何者會趨向正反應？",
        type: "multiple",
        options: [
          { key: "A", text: "A、B、C 各 2 mol" },
          { key: "B", text: "A、B、C 分別為 1、2、3 mol" },
          { key: "C", text: "A、B、C 分別為 2、2、3 mol" },
          { key: "D", text: "A、B、C 分別為 2、1、2 mol" },
          { key: "E", text: "A、B、C 分別為 2、1、3 mol" }
        ],
        answer: ["A", "C", "D"],
        explanation: "Q ＝ [C]<sup>3</sup> / ([A][B]) ＝ (n<sub>C</sub><sup>3</sup> / (n<sub>A</sub>·n<sub>B</sub>)) × (1/V)。(A) Q ＝ (8/4) × (1/5) ＝ 0.4 ＜ 2 向右；(B) Q ＝ 2.7 ＞ 2 向左；(C) Q ＝ 1.35 ＜ 2 向右；(D) Q ＝ 0.8 ＜ 2 向右；(E) Q ＝ 2.7 ＞ 2 向左。"
      },
      {

        type: "single",
        options: [

        ],

        explanation: "同離子效應使 s<sub>1</sub>、s<sub>2</sub> 小於純水 s<sub>4</sub>；且 Cl<sup>-</sup> 為平方項抑制更強烈故 s<sub>1</sub> ＞ s<sub>2</sub>。在 NaI 中生成溶度積更小的 PbI<sub>2</sub> 沉澱消耗 Pb<sup>2+</sup>，使得 PbCl<sub>2</sub> 溶解度大增，故 s<sub>3</sub> ＞ s<sub>4</sub>。順序：s<sub>3</sub> ＞ s<sub>4</sub> ＞ s<sub>1</sub> ＞ s<sub>2</sub>。"

        options: [
          { key: "A", text: "356" },

        ],
        answer: ["C"],
        explanation: "依比色法 c<sub>1</sub>h<sub>1</sub>＝c<sub>2</sub>h<sub>2</sub>，平衡 [FeSCN<sup>2+</sup>] ＝ 1.0 × 10<sup>-3</sup> × (7/10) ＝ 7.0 × 10<sup>-4</sup> M。各取 10 mL 稀釋後初濃度：[Fe<sup>3+</sup>]<sub>初</sub> ＝ 1.6 × 10<sup>-2</sup> M，[SCN<sup>-</sup>]<sub>初</sub> ＝ 1.0 × 10<sup>-3</sup> M。平衡時 [Fe<sup>3+</sup>] ＝ 1.53 × 10<sup>-2</sup> M，[SCN<sup>-</sup>] ＝ 3.0 × 10<sup>-4</sup> M。<i>K</i> ＝ (7.0 × 10<sup>-4</sup>) / (1.53 × 10<sup>-2</sup> × 3.0 × 10<sup>-4</sup>) ≈ 153。"

    const statusMap = {};
    const detailRecords = {};
    let isUploaded = false;

    function renderQuiz() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';
      document.getElementById('totalCount').innerText = quizData.length;

      quizData.forEach((q, idx) => {
        const isSingle = q.type === 'single';
        const inputType = isSingle ? 'radio' : 'checkbox';
        const typeBadge = isSingle ? '單選題' : '多選題';

        let optionsHtml = '';
        q.options.forEach(opt => {
          const changeHandler = isSingle ? `onchange="submitAndLock(${q.id})"` : '';
          optionsHtml += `
            <label class="option-label" id="label_${q.id}_${opt.key}">
              <input type="${inputType}" name="q_${q.id}" value="${opt.key}" ${changeHandler}>
              <span><strong>(${opt.key})</strong> ${opt.text}</span>
            </label>
          `;
        });

        const actionButton = !isSingle
          ? `<button type="button" id="btn_${q.id}" class="btn-submit-q" onclick="submitAndLock(${q.id})">確定送出本題（鎖定）</button>`
          : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card_${q.id}`;
        card.innerHTML = `
          <div class="q-title">
            <span class="q-type">${typeBadge}</span>
            <span id="locked_badge_${q.id}"></span>
            第 ${idx + 1} 題：${q.title}
          </div>
          <div class="options">${optionsHtml}</div>
          ${actionButton}
          <div class="result-box" id="result_${q.id}"></div>
        `;
        container.appendChild(card);
      });

      updateStatus();
    }

    function validateStudentInfo() {
      const sClass = document.getElementById('studentClass').value.trim();
      const sSeat = document.getElementById('studentSeat').value.trim();
      const sName = document.getElementById('studentName').value.trim();

      if (!sClass || !sSeat || !sName) {
        alert('請先填寫「班級」、「座號」與「姓名」後再開始作答！');
        return false;
      }

      document.getElementById('studentClass').disabled = true;
      document.getElementById('studentSeat').disabled = true;
      document.getElementById('studentName').disabled = true;
      return true;
    }

    function submitAndLock(id) {
      if (statusMap[id] !== undefined) return;

      if (!validateStudentInfo()) {
        const inputs = document.querySelectorAll(`input[name="q_${id}"]`);
        inputs.forEach(i => i.checked = false);
        return;
      }

      const q = quizData.find(item => item.id === id);
      if (!q) return;

      const checkedInputs = document.querySelectorAll(`input[name="q_${id}"]:checked`);
      const userAnswers = Array.from(checkedInputs).map(i => i.value).sort();
      const correctAnswers = [...q.answer].sort();

      const resultBox = document.getElementById(`result_${id}`);

      if (userAnswers.length === 0) {
        alert('請先勾選答案再送出本題！');
        return;
      }

      // 鎖定本題
      const allInputs = document.querySelectorAll(`input[name="q_${id}"]`);
      allInputs.forEach(input => input.disabled = true);
      q.options.forEach(opt => {
        const label = document.getElementById(`label_${id}_${opt.key}`);
        if (label) label.classList.add('disabled');
      });

      const submitBtn = document.getElementById(`btn_${id}`);
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.style.display = 'none';
      }

      const lockBadge = document.getElementById(`locked_badge_${id}`);
      if (lockBadge) {
        lockBadge.className = 'locked-badge';
        lockBadge.innerText = '已鎖定';
      }

      const isCorrect = userAnswers.length === correctAnswers.length &&
                        userAnswers.every((val, index) => val === correctAnswers[index]);

      resultBox.style.display = 'block';
      if (isCorrect) {
        resultBox.className = 'result-box result-correct';
        resultBox.innerHTML = `
          <strong>✔ 答對了！</strong> 正確答案：(${correctAnswers.join(', ')})
          <div class="explanation"><strong>💡 解題步驟與觀念：</strong><br>${q.explanation}</div>
        `;
      } else {
        resultBox.className = 'result-box result-wrong';
        resultBox.innerHTML = `
          <strong>✖ 答錯了！</strong> 正確答案是：(${correctAnswers.join(', ')})<br>
          您的作答：(${userAnswers.join(', ')})
          <div class="explanation"><strong>💡 解題步驟與觀念：</strong><br>${q.explanation}</div>
        `;
      }

      statusMap[id] = isCorrect;
      detailRecords[`Q${id}`] = {
        userAnswers: userAnswers,
        correctAnswers: correctAnswers,
        isCorrect: isCorrect
      };

      updateStatus();
    }

    function updateStatus() {
      const answeredKeys = Object.keys(statusMap);
      const answeredCount = answeredKeys.length;
      let correctCount = 0;

      answeredKeys.forEach(k => {
        if (statusMap[k]) correctCount++;
      });

      document.getElementById('answeredCount').innerText = answeredCount;
      const score = Math.round((correctCount / quizData.length) * 100);
      document.getElementById('scoreText').innerText = score;

      // 20 題皆完成時觸發上傳
      if (answeredCount === quizData.length && !isUploaded) {
        uploadResultsToSheet(score, correctCount, quizData.length);
      }
    }

    function uploadResultsToSheet(score, correctCount, totalCount) {
      isUploaded = true;
      const banner = document.getElementById('uploadBanner');
      banner.style.display = 'block';
      banner.style.color = '#2563eb';
      banner.innerText = '⏳ 全卷作答完畢，正在上傳成績至教師端試算表...';

      const payload = {
        studentClass: document.getElementById('studentClass').value.trim(),
        studentSeat: document.getElementById('studentSeat').value.trim(),
        studentName: document.getElementById('studentName').value.trim(),
        score: score,
        correctCount: correctCount,
        totalCount: totalCount,
        details: detailRecords
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        banner.style.color = '#16a34a';
        banner.innerText = '✅ 成績已成功登錄至試算表！全卷測驗已圓滿結束。';
      })
      .catch((err) => {
        banner.style.color = '#dc2626';
        banner.innerText = '⚠️ 成績上傳失敗，請檢查網路連線或聯絡老師。';
      });
    }

    renderQuiz();
  </script>
</body>
