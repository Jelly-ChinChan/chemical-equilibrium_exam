<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中化學：化學平衡 AI 自適應測驗與學習診斷</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #64748b;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --gray-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--gray-bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      color: #1e3a8a;
      margin-bottom: 6px;
      font-size: 1.6rem;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }
    .student-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .info-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 180px;
    }
    .info-group label {
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    .info-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    .info-group input:disabled {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .mode-card {
      background: #ffffff;
      border: 2px solid #93c5fd;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    }
    .mode-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #1e40af;
      margin-bottom: 14px;
    }
    .mode-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn-mode {
      flex: 1;
      min-width: 250px;
      max-width: 360px;
      padding: 14px 18px;
      background: #eff6ff;
      border: 2px solid var(--primary);
      border-radius: 8px;
      color: var(--primary);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-mode:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .status-bar {
      position: sticky;
      top: 15px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .status-info {
      font-size: 1rem;
      font-weight: 600;
    }
    .status-score {
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .q-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 16px;
    }
    .q-type {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
    }
    .level-badge {
      display: inline-block;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
      font-weight: 600;
    }
    .level-1 { background: #dcfce7; color: #166534; }
    .level-2 { background: #fef3c7; color: #b45309; }
    .level-3 { background: #fee2e2; color: #991b1b; }

    .locked-badge {
      display: inline-block;
      background: #fee2e2;
      color: #991b1b;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-label {
      display: flex;
      align-items: flex-start;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-label:hover {
      background: var(--primary-light);
      border-color: #93c5fd;
    }
    .option-label.disabled {
      cursor: not-allowed;
      background: #f1f5f9;
      opacity: 0.85;
      border-color: #cbd5e1;
    }
    .option-label input {
      margin-top: 5px;
      margin-right: 12px;
      transform: scale(1.15);
    }
    .btn-submit-q {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
    }
    .result-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .result-correct {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .result-wrong {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .explanation {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #334155;
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
    }

    .adaptive-next-box {
      text-align: center;
      margin: 24px 0;
    }
    .btn-next-adaptive {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
      transition: all 0.2s;
    }

    .upload-banner {
      display: none;
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* 總評報告卡樣式 */
    .report-card {
      display: none;
      background: #ffffff;
      border: 2px solid #3b82f6;
      border-radius: 16px;
      padding: 26px;
      margin: 30px 0 60px 0;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
      animation: fadeIn 0.4s ease-out;
    }
    .report-header {
      border-bottom: 2px solid #eff6ff;
      padding-bottom: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .report-title {
      font-size: 1.4rem;
      color: #1e3a8a;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .report-summary-text {
      color: #475569;
      font-size: 1rem;
    }
    .diag-section {
      margin-bottom: 20px;
      padding: 16px;
      border-radius: 10px;
    }
    .diag-clear {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }
    .diag-reinforce {
      background: #fffbeb;
      border: 1px solid #fde68a;
    }
    .diag-weak {
      background: #fef2f2;
      border: 1px solid #fecaca;
    }
    .diag-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .diag-list {
      margin: 0;
      padding-left: 22px;
      font-size: 0.95rem;
      color: #334155;
    }
    .diag-list li {
      margin-bottom: 6px;
    }
    .study-advice-box {
      background: #f8fafc;
      border-left: 4px solid #3b82f6;
      padding: 14px 18px;
      border-radius: 6px;
      margin-top: 18px;
      font-size: 0.95rem;
      color: #1e293b;
    }

    sub, sup {
      font-size: 75%;
      line-height: 0;
      position: relative;
      vertical-align: baseline;
    }
    sub { bottom: -0.25em; }
    sup { top: -0.5em; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🧪 高中化學：化學平衡 AI 自適應測驗</h1>
      <p class="subtitle">全卷共 20 題 ｜ 支援即時解析、難度自適應、試算表自動登分與全方位學習診斷總評。</p>
    </header>

    <div class="student-card">
      <div class="info-group">
        <label for="studentClass">班級：</label>
        <input type="text" id="studentClass" placeholder="例如：高二甲班">
      </div>
      <div class="info-group">
        <label for="studentSeat">座號：</label>
        <input type="text" id="studentSeat" placeholder="例如：12">
      </div>
      <div class="info-group">
        <label for="studentName">姓名：</label>
        <input type="text" id="studentName" placeholder="請輸入姓名">
      </div>
    </div>

    <!-- 模式選擇 -->
    <div id="modeCard" class="mode-card">
      <div class="mode-title">🎯 請選擇作答呈現模式（未填寫資料將以訪客作答）：</div>
      <div class="mode-btns">
        <button type="button" class="btn-mode" onclick="startQuiz('adaptive')">
          🤖 AI 智慧自適應模式<br><small style="font-weight: normal;">(答對自動晉級難題，答錯以基礎題鞏固)</small>
        </button>
        <button type="button" class="btn-mode" onclick="startQuiz('all')">
          📋 全卷標準模式<br><small style="font-weight: normal;">(一次展開全部 20 題)</small>
        </button>
      </div>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="status-info">已作答：<span id="answeredCount">0</span> / <span id="totalCount">20</span> 題</div>
      <div class="status-info status-score">目前得分：<span id="scoreText">0</span> 分</div>
    </div>

    <form id="quizForm">
      <div id="questionsContainer"></div>
    </form>

    <div id="adaptiveNextBox" class="adaptive-next-box" style="display: none;">
      <button type="button" id="btnNextAdaptive" class="btn-next-adaptive" onclick="renderNextAdaptiveQuestion()">
        ✨ 載入下一題
      </button>
    </div>

    <!-- 上傳提示橫幅 -->
    <div id="uploadBanner" class="upload-banner"></div>

    <!-- 學習概念診斷總評報告卡 -->
    <div id="reportCard" class="report-card">
      <div class="report-header">
        <div class="report-title">📊 化學平衡單元：學習能力診斷總評</div>
        <div id="reportStudentInfo" class="report-summary-text"></div>
      </div>
      <div id="reportSections"></div>
      <div id="studyAdvice" class="study-advice-box"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxL8aghmYIWUVNeQRD9-4bXDAIVTZjd-5afQLoe1irKaFBM6VjTPE6yHvi-7PVTL6q/exec";

    // 概念模組對應表
    const CONCEPT_MAP = {
      "definition": { name: "化學平衡基本定義與動態平衡", desc: "了解正逆反應速率相等、濃度維持定值與平衡條件。" },
      "expression": { name: "平衡常數表示式與熱化學關係", desc: "掌握純固體/液體排除規則、方程式係數倍數與逆向時 K 與 ΔH 之換算。" },
      "calculation": { name: "平衡常數數值與平衡濃度計算", desc: "熟悉 Kc、Kp 計算方法、氣體分壓計算及比色法計算。" },
      "le_chatelier": { name: "勒沙特列原理與平衡移動判斷", desc: "溫度（吸/放熱）、壓力（體積壓縮）、加酸加鹼及同離子對平衡移動方向之影響。" },
      "solubility": { name: "沉澱溶解平衡與溶度積 (Ksp)", desc: "掌握微溶性鹽類 Ksp 計算、同離子效應對溶解度之抑制以及沉澱競爭反應。" }
    };

    // 20 題題庫資料（標註所屬 concept 與難度 level）
    const rawQuizData = [
      {
        id: 1, level: 1, concept: "definition",
        title: "25 ℃ 時，2Cl(g) ⇌ Cl2(g) 之 Kc＝1 × 10^38，若原有 [Cl]＝1 M，則平衡時 Cl2 之濃度為多少 M？",
        type: "single",
        options: [
          { key: "A", text: "0.1" },
          { key: "B", text: "0.5" },
          { key: "C", text: "1" },
          { key: "D", text: "10^-38" }
        ],
        answer: ["B"],
        explanation: "由 2Cl(g) ⇌ Cl2(g) 之 Kc 極大可知反應幾乎完全向右，完全反應時 [Cl2] ≈ 0.5 M。"
      },
      {
        id: 2, level: 3, concept: "calculation",
        title: "氫和碘蒸氣各 1.6 mol 於 2.0 L 容器中反應生成碘化氫，若 350 ℃ 時的平衡常數為 36.0，則平衡時有關各反應物及產物的濃度，哪些是正確的？",
        type: "multiple",
        options: [
          { key: "A", text: "[H2]＝0.1 M" },
          { key: "B", text: "[I2]＝0.2 M" },
          { key: "C", text: "[HI]＝1.2 M" },
          { key: "D", text: "[H2]＝1.2 M" },
          { key: "E", text: "[HI]＝0.2 M" }
        ],
        answer: ["B", "C"],
        explanation: "初濃度 [H2]=[I2]=0.8 M。 (2x)^2 / (0.8-x)^2 = 36 ⇒ x = 0.6。平衡時 [H2]=[I2]=0.2 M，[HI]=1.2 M。"
      },
      {
        id: 3, level: 2, concept: "le_chatelier",
        title: "下列各平衡系中，何者的平衡常數會隨溫度升高而變大？",
        type: "multiple",
        options: [
          { key: "A", text: "N2O4(g) ⇌ 2NO2(g)" },
          { key: "B", text: "Cl2(g) ⇌ 2Cl(g)" },
          { key: "C", text: "N2(g) + 3H2(g) ⇌ 2NH3(g)" },
          { key: "D", text: "H+(aq) + OH-(aq) ⇌ H2O(l)" },
          { key: "E", text: "NaNO3(s) ⇌ NaNO2(s) + 1/2 O2(g)" }
        ],
        answer: ["A", "B", "E"],
        explanation: "吸熱反應升溫使平衡常數變大。(A)(B)(E)均為吸熱分解；(C)合成氨放熱；(D)酸鹼中和放熱。"
      },
      {
        id: 4, level: 2, concept: "expression",
        title: "A2B4 ⇌ 2AB2 的反應熱為 ΔH，平衡常數為 K，在同溫時，反應 AB2 ⇌ 1/2 A2B4，反應熱（ΔH'）及平衡常數（K'）應各為何？",
        type: "multiple",
        options: [
          { key: "A", text: "K'＝1 / K" },
          { key: "B", text: "ΔH'＝ΔH" },
          { key: "C", text: "ΔH'＝-1/2 ΔH" },
          { key: "D", text: "K'＝K" },
          { key: "E", text: "(K')^2＝1 / K" }
        ],
        answer: ["C", "E"],
        explanation: "反應逆向並乘以 1/2，故 ΔH' = -1/2 ΔH，K' = (1/K)^(1/2)，即 (K')^2 = 1/K。"
      },
      {
        id: 5, level: 2, concept: "expression",
        title: "下列有關平衡常數表示式的敘述中，何者不正確？",
        type: "multiple",
        options: [
          { key: "A", text: "Hg2Cl2(s) 之 Ksp＝[Hg+]^2 [Cl-]^2" },
          { key: "B", text: "NH3(aq) + H2O(l) ⇌ NH4+(aq) + OH-(aq) 之 Kc＝([NH4+][OH-]) / ([NH3][H2O])" },
          { key: "C", text: "2HgO(s) ⇌ 2Hg(l) + O2(g) 之 Kc＝[O2]" },
          { key: "D", text: "CO(g) + 3H2(g) ⇌ CH4(g) + H2O(g) 之 Kc＝([CH4][H2O]) / ([CO][H2])" },
          { key: "E", text: "C2H5OH(l) ⇌ C2H5OH(g) 之 Kc＝1 / [C2H5OH(g)]" }
        ],
        answer: ["A", "B", "D", "E"],
        explanation: "(A) Ksp=[Hg2^2+][Cl-]^2；(B) 水為溶劑不列入；(D) 應為[CO][H2]^3；(E) 應為 Kc=[C2H5OH(g)]。"
      },
      {
        id: 6, level: 1, concept: "calculation",
        title: "下列平衡系，何者 Kp 與 Kc 之數值與單位無關（即 Kp ＝ Kc）？",
        type: "multiple",
        options: [
          { key: "A", text: "CO(g) + 1/2 O2(g) ⇌ CO2(g)" },
          { key: "B", text: "C2H4(g) + H2(g) ⇌ C2H6(g)" },
          { key: "C", text: "H2(g) + F2(g) ⇌ 2HF(g)" },
          { key: "D", text: "N2(g) + 3F2(g) ⇌ 2NF3(g)" },
          { key: "E", text: "H2O(g) + CO(g) ⇌ H2(g) + CO2(g)" }
        ],
        answer: ["C", "E"],
        explanation: "Kp = Kc(RT)^Δn，當 Δn = 0 時，Kp = Kc。(C) Δn = 0；(E) Δn = 0。"
      },
      {
        id: 7, level: 1, concept: "definition",
        title: "定溫下，當 A(aq) + 3B(aq) ⇌ 2C(aq) 達平衡時，下列敘述何者正確？",
        type: "multiple",
        options: [
          { key: "A", text: "A、B、C 三者濃度皆維持不變" },
          { key: "B", text: "正反應速率＝逆反應速率＝0" },
          { key: "C", text: "A 的消耗速率＝B 的消耗速率＝C 的生成速率" },
          { key: "D", text: "A、B、C 的莫耳數比 nA：nB：nC＝1：3：2" },
          { key: "E", text: "[C]^2 / ([A][B]^3) 為定值" }
        ],
        answer: ["A", "E"],
        explanation: "平衡時為動態平衡，正逆反應速率相等且不為0；濃度維持定值；反應商等於平衡常數。"
      },
      {
        id: 8, level: 3, concept: "calculation",
        title: "在 1000 K 時，反應 CaCO3(s) ⇌ CaO(s) + CO2(g) 達平衡時 PCO2＝0.04 atm；同溫時，C(s) + CO2(g) ⇌ 2CO(g) 之 Kp＝1.96 atm。若將足量 C(s)、CaO(s) 和 CaCO3(s) 置於密閉容器，於 1000 K 達平衡時，下列何者正確？",
        type: "multiple",
        options: [
          { key: "A", text: "PCO2 ＜ 0.04 atm" },
          { key: "B", text: "PCO＝0.28 atm" },
          { key: "C", text: "C(s) 的量較開始反應時少" },
          { key: "D", text: "CaO(s) 的量較開始反應時少" },
          { key: "E", text: "CaCO3(s) 的量較開始反應時少" }
        ],
        answer: ["B", "C", "E"],
        explanation: "PCO2 恆為 0.04 atm。(PCO)^2 / 0.04 = 1.96 ⇒ PCO = 0.28 atm。反應進行消耗 C 與 CaCO3 生成 CaO 與 CO。"
      },
      {
        id: 9, level: 1, concept: "expression",
        title: "下列平衡系中，各物質的濃度或壓力單位，不論以 mol L^-1 或 mmHg 表示，其平衡常數的數值均相同的為何？",
        type: "multiple",
        options: [
          { key: "A", text: "2SO2(g) + O2(g) ⇌ 2SO3(g)" },
          { key: "B", text: "PCl5(g) ⇌ PCl3(g) + Cl2(g)" },
          { key: "C", text: "H2(g) + I2(g) ⇌ 2HI(g)" },

    // 化學上下標符號轉換器
    function formatChem(str) {
      if (!str) return '';
      return str
        .replace(/\bKc\b/g, '<i>K</i><sub>c</sub>')
        .replace(/\bKp\b/g, '<i>K</i><sub>p</sub>')
        .replace(/\bKsp\b/g, '<i>K</i><sub>sp</sub>')
        .replace(/\bK\b/g, '<i>K</i>')
        .replace(/H\+/g, 'H<sup>+</sup>')
        .replace(/OH\-/g, 'OH<sup>-</sup>')
        .replace(/Ag\+/g, 'Ag<sup>+</sup>')
        .replace(/Cl\-/g, 'Cl<sup>-</sup>')
        .replace(/Ba2\+/g, 'Ba<sup>2+</sup>')
        .replace(/Fe3\+/g, 'Fe<sup>3+</sup>')
        .replace(/SCN\-/g, 'SCN<sup>-</sup>')
        .replace(/FeSCN2\+/g, 'FeSCN<sup>2+</sup>')
        .replace(/CrO4\^?2\-/g, 'CrO<sub>4</sub><sup>2-</sup>')
        .replace(/NH4\+/g, 'NH<sub>4</sub><sup>+</sup>')
        .replace(/Hg2\^?2\+/g, 'Hg<sub>2</sub><sup>2+</sup>')
        .replace(/10\^(-?\d+)/g, '10<sup>$1</sup>')
        .replace(/PCO2/g, 'P<sub>CO<sub>2</sub></sub>')
        .replace(/PCO/g, 'P<sub>CO</sub>')
        .replace(/([A-Za-z\)])(\d+)/g, function(match, p1, p2) {
          return p1 + '<sub>' + p2 + '</sub>';
        });
    }

    let selectedMode = '';
    let currentDifficulty = 1;
    const servedQuestionIds = [];
    const statusMap = {};
    const detailRecords = {};
    let isUploaded = false;

    function checkStudentInfo() {
      let sClass = document.getElementById('studentClass').value.trim();
      let sSeat = document.getElementById('studentSeat').value.trim();
      let sName = document.getElementById('studentName').value.trim();

      if (!sClass || !sSeat || !sName) {
        const proceed = confirm(
          "⚠️ 您尚未填寫完整的學生資料（班級、座號、姓名）。\n\n" +
          "確定要以【匿名／訪客】身分直接開始作答嗎？\n" +
          "（成績與作答紀錄仍會上傳試算表備查，並產生個人學習診斷總評）"
        );
        if (!proceed) return false;

        if (!sClass) document.getElementById('studentClass').value = "訪客";
        if (!sSeat) document.getElementById('studentSeat').value = "0";
        if (!sName) document.getElementById('studentName').value = "匿名學生";
      }

      document.getElementById('studentClass').disabled = true;
      document.getElementById('studentSeat').disabled = true;
      document.getElementById('studentName').disabled = true;
      return true;
    }

    function startQuiz(mode) {
      if (!checkStudentInfo()) return;

      selectedMode = mode;
      document.getElementById('modeCard').style.display = 'none';
      document.getElementById('statusBar').style.display = 'flex';

      if (mode === 'adaptive') {
        currentDifficulty = 1;
        renderNextAdaptiveQuestion();
      } else {
        rawQuizData.forEach((q, idx) => {
          renderQuestionCard(q, idx + 1);
        });
      }
    }

    function pickNextAdaptiveQuestion() {
      const unserved = rawQuizData.filter(q => !servedQuestionIds.includes(q.id));
      if (unserved.length === 0) return null;

      let candidates = unserved.filter(q => q.level === currentDifficulty);
      if (candidates.length === 0) {
        if (currentDifficulty === 3) candidates = unserved.filter(q => q.level === 2);
        else if (currentDifficulty === 1) candidates = unserved.filter(q => q.level === 2);
        if (!candidates || candidates.length === 0) candidates = unserved;
      }

      const randomIndex = Math.floor(Math.random() * candidates.length);
      return candidates[randomIndex];
    }

    function renderNextAdaptiveQuestion() {
      document.getElementById('adaptiveNextBox').style.display = 'none';
      const nextQ = pickNextAdaptiveQuestion();
      if (!nextQ) return;

      servedQuestionIds.push(nextQ.id);
      renderQuestionCard(nextQ, servedQuestionIds.length);
    }

    function renderQuestionCard(q, displayNum) {
      const container = document.getElementById('questionsContainer');
      const isSingle = q.type === 'single';
      const inputType = isSingle ? 'radio' : 'checkbox';
      const typeBadge = isSingle ? '單選題' : '多選題';

      let levelText = '⭐ 基礎題';
      let levelClass = 'level-1';
      if (q.level === 2) { levelText = '⭐⭐ 中階題'; levelClass = 'level-2'; }
      if (q.level === 3) { levelText = '⭐⭐⭐ 挑戰題'; levelClass = 'level-3'; }

      let optionsHtml = '';
      q.options.forEach(opt => {
        const changeHandler = isSingle ? `onchange="submitAndLock(${q.id})"` : '';
        optionsHtml += `
          <label class="option-label" id="label_${q.id}_${opt.key}">
            <input type="${inputType}" name="q_${q.id}" value="${opt.key}" ${changeHandler}>
            <span><strong>(${opt.key})</strong> ${formatChem(opt.text)}</span>
          </label>
        `;
      });

      const actionButton = !isSingle
        ? `<button type="button" id="btn_${q.id}" class="btn-submit-q" onclick="submitAndLock(${q.id})">確定送出本題（鎖定）</button>`
        : '';

      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card_${q.id}`;
      card.innerHTML = `
        <div class="q-title">
          <span class="q-type">${typeBadge}</span>
          <span class="level-badge ${levelClass}">${levelText}</span>
          <span id="locked_badge_${q.id}"></span>
          第 ${displayNum} 題：${formatChem(q.title)}
        </div>
        <div class="options">${optionsHtml}</div>
        ${actionButton}
        <div class="result-box" id="result_${q.id}"></div>
      `;
      container.appendChild(card);
    }

    function submitAndLock(id) {
      if (statusMap[id] !== undefined) return;

      const q = rawQuizData.find(item => item.id === id);
      if (!q) return;

      const checkedInputs = document.querySelectorAll(`input[name="q_${id}"]:checked`);
      const userAnswers = Array.from(checkedInputs).map(i => i.value).sort();
      const correctAnswers = [...q.answer].sort();

      const resultBox = document.getElementById(`result_${id}`);

      if (userAnswers.length === 0) {
        alert('請先勾選答案再送出本題！');
        return;
      }

      const allInputs = document.querySelectorAll(`input[name="q_${id}"]`);
      allInputs.forEach(input => input.disabled = true);
      q.options.forEach(opt => {
        const label = document.getElementById(`label_${id}_${opt.key}`);
        if (label) label.classList.add('disabled');
      });

      const submitBtn = document.getElementById(`btn_${id}`);
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.style.display = 'none';
      }

      const lockBadge = document.getElementById(`locked_badge_${id}`);
      if (lockBadge) {
        lockBadge.className = 'locked-badge';
        lockBadge.innerText = '已鎖定';
      }

      const isCorrect = userAnswers.length === correctAnswers.length &&
                        userAnswers.every((val, index) => val === correctAnswers[index]);

      resultBox.style.display = 'block';
      if (isCorrect) {
        resultBox.className = 'result-box result-correct';
        resultBox.innerHTML = `
          <strong>✔ 答對了！</strong> 正確答案：(${correctAnswers.join(', ')})
          <div class="explanation"><strong>💡 解題步驟與觀念：</strong><br>${formatChem(q.explanation)}</div>
        `;
        if (currentDifficulty < 3) currentDifficulty++;
      } else {
        resultBox.className = 'result-box result-wrong';
        resultBox.innerHTML = `
          <strong>✖ 答錯了！</strong> 正確答案是：(${correctAnswers.join(', ')})<br>
          您的作答：(${userAnswers.join(', ')})
          <div class="explanation"><strong>💡 解題步驟與觀念：</strong><br>${formatChem(q.explanation)}</div>
        `;
        if (currentDifficulty > 1) currentDifficulty--;
      }

      statusMap[id] = isCorrect;
      detailRecords[`Q${id}`] = {
        userAnswers: userAnswers,
        correctAnswers: correctAnswers,
        isCorrect: isCorrect
      };

      updateStatus();

      if (selectedMode === 'adaptive' && servedQuestionIds.length < rawQuizData.length) {
        const nextBox = document.getElementById('adaptiveNextBox');
        const nextBtn = document.getElementById('btnNextAdaptive');
        nextBox.style.display = 'block';
        nextBtn.innerText = `✨ 進入第 ${servedQuestionIds.length + 1} 題（AI 智慧動態難度）`;
      }
    }

    function updateStatus() {
      const answeredKeys = Object.keys(statusMap);
      const answeredCount = answeredKeys.length;
      let correctCount = 0;

      answeredKeys.forEach(k => {
        if (statusMap[k]) correctCount++;
      });

      document.getElementById('answeredCount').innerText = answeredCount;
      const score = Math.round((correctCount / rawQuizData.length) * 100);
      document.getElementById('scoreText').innerText = score;

      if (answeredCount === rawQuizData.length && !isUploaded) {
        uploadResultsToSheet(score, correctCount, rawQuizData.length);
        generateDiagnosticReport(score, correctCount);
      }
    }

    // 生成能力診斷總評報告
    function generateDiagnosticReport(score, correctCount) {
      const reportCard = document.getElementById('reportCard');
      const studentInfo = document.getElementById('reportStudentInfo');
      const sections = document.getElementById('reportSections');
      const advice = document.getElementById('studyAdvice');

      const sClass = document.getElementById('studentClass').value;
      const sSeat = document.getElementById('studentSeat').value;
      const sName = document.getElementById('studentName').value;

      studentInfo.innerText = `考生：${sClass} ${sSeat}號 ${sName} ｜ 總成績：${score} 分（答對 ${correctCount} / 20 題）`;

      // 統計各概念模組的答對率
      const conceptStats = {};
      Object.keys(CONCEPT_MAP).forEach(k => {
        conceptStats[k] = { total: 0, correct: 0, title: CONCEPT_MAP[k].name, desc: CONCEPT_MAP[k].desc };
      });

      rawQuizData.forEach(q => {
        const cKey = q.concept;
        if (conceptStats[cKey]) {
          conceptStats[cKey].total++;
          if (statusMap[q.id]) {
            conceptStats[cKey].correct++;
          }
        }
      });

      const clearList = [];      // >= 70%
      const reinforceList = [];  // 30% ~ 69%
      const weakList = [];       // < 30%

      Object.keys(conceptStats).forEach(k => {
        const stat = conceptStats[k];
        const rate = stat.total > 0 ? (stat.correct / stat.total) : 0;
        const ratePercent = Math.round(rate * 100);
        const itemInfo = `<strong>${stat.title}</strong>（答對率 ${ratePercent}%，${stat.correct}/${stat.total}題）<br><span style="color:#64748b; font-size:0.9rem;">📌 重點內涵：${stat.desc}</span>`;

        if (rate >= 0.7) {
          clearList.push(itemInfo);
        } else if (rate >= 0.3) {
          reinforceList.push(itemInfo);
        } else {
          weakList.push(itemInfo);
        }
      });

      let sectionsHtml = '';

      if (clearList.length > 0) {
        sectionsHtml += `
          <div class="diag-section diag-clear">
            <div class="diag-title" style="color: #166534;">🟢 【觀念清楚】已充分掌握之領域：</div>
            <ul class="diag-list">${clearList.map(li => `<li>${li}</li>`).join('')}</ul>
          </div>
        `;
      }

      if (reinforceList.length > 0) {
        sectionsHtml += `
          <div class="diag-section diag-reinforce">
            <div class="diag-title" style="color: #b45309;">🟡 【需要加強】觀念未臻完備，需多加練習：</div>
            <ul class="diag-list">${reinforceList.map(li => `<li>${li}</li>`).join('')}</ul>
          </div>
        `;
      }

      if (weakList.length > 0) {
        sectionsHtml += `
          <div class="diag-section diag-weak">
            <div class="diag-title" style="color: #991b1b;">🔴 【可能完全不會】基礎薄弱或尚未建立，需優先複習：</div>
            <ul class="diag-list">${weakList.map(li => `<li>${li}</li>`).join('')}</ul>
          </div>
        `;
      }

      sections.innerHTML = sectionsHtml;

      // 綜合診斷學習建議
      let adviceText = '<strong>💡 AI 學習導航建議：</strong><br>';
      if (score >= 85) {
        adviceText += '您的化學平衡觀念非常扎實！對各類平衡移動與計算皆有相當高的敏銳度。建議可進一步挑戰高三選修化學之酸鹼鹽緩衝溶液或多重錯離子平衡深度題。';
      } else if (score >= 60) {
        adviceText += '整體基礎觀念尚屬良好，但遇到多重平衡聯立計算、或多選題中多條件綜合判斷時容易失分。請優先針對「需要加強」與「可能完全不會」的模組詳讀各題解析並重新演練。';
      } else {
        adviceText += '目前在化學平衡單元的掌握度較低，尤其是動態平衡的微觀定義與勒沙特列原理方向判斷容易混淆。建議先放下繁複計算題，回到課本將平衡常數 Kc/Kp 的物理意義與平衡移動的定性規律重新讀懂，再行作答演練。';
      }
      advice.innerHTML = adviceText;

      reportCard.style.display = 'block';
      reportCard.scrollIntoView({ behavior: 'smooth' });
    }

    function uploadResultsToSheet(score, correctCount, totalCount) {
      isUploaded = true;
      const banner = document.getElementById('uploadBanner');
      banner.style.display = 'block';
      banner.style.color = '#2563eb';
      banner.innerText = '⏳ 全卷 20 題已作答完畢，正在上傳成績至教師端試算表...';

      const payload = {
        studentClass: document.getElementById('studentClass').value.trim(),
        studentSeat: document.getElementById('studentSeat').value.trim(),
        studentName: document.getElementById('studentName').value.trim(),
        score: score,
        correctCount: correctCount,
        totalCount: totalCount,
        details: detailRecords
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        banner.style.color = '#16a34a';
        banner.innerText = '✅ 成績與詳細作答紀錄已成功登錄至試算表！下方為您的單元能力總評報告：';
      })
      .catch((err) => {
        banner.style.color = '#dc2626';
        banner.innerText = '⚠️ 成績上傳失敗，請檢查網路連線或聯絡老師。';
      });
    }
  </script>
</body>
</html>
