<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中化學：化學平衡正式全卷測驗</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --gray-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--gray-bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      color: #1e3a8a;
      margin-bottom: 6px;
      font-size: 1.6rem;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }
    .student-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .info-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 180px;
    }
    .info-group label {
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    .info-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    .info-group input:disabled {
      background-color: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    /* 測驗模式選擇卡片 */
    .mode-card {
      background: #ffffff;
      border: 2px solid #93c5fd;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    }
    .mode-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #1e40af;
      margin-bottom: 14px;
    }
    .mode-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn-mode {
      flex: 1;
      min-width: 240px;
      max-width: 340px;
      padding: 14px 18px;
      background: #eff6ff;
      border: 2px solid var(--primary);
      border-radius: 8px;
      color: var(--primary);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-mode:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .status-bar {
      position: sticky;
      top: 15px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .status-info {
      font-size: 1rem;
      font-weight: 600;
    }
    .status-score {
      color: var(--primary);
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .q-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 16px;
    }
    .q-type {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 6px;
    }
    .locked-badge {
      display: inline-block;
      background: #fee2e2;
      color: #991b1b;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-label {
      display: flex;
      align-items: flex-start;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-label:hover {
      background: var(--primary-light);
      border-color: #93c5fd;
    }
    .option-label.disabled {
      cursor: not-allowed;
      background: #f1f5f9;
      opacity: 0.85;
      border-color: #cbd5e1;
    }
    .option-label input {
      margin-top: 5px;
      margin-right: 12px;
      transform: scale(1.15);
    }
    .btn-submit-q {
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
    }
    .result-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }
    .result-correct {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .result-wrong {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .explanation {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #334155;
      background: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid var(--primary);
    }

    /* 漸進加載按鈕區塊 */
    .load-more-box {
      text-align: center;
      margin: 28px 0;
    }
    .btn-load-more {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
      transition: all 0.2s;
    }
    .btn-load-more:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .upload-banner {
      display: none;
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 50px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    sub, sup {
      font-size: 75%;
      line-height: 0;
      position: relative;
      vertical-align: baseline;
    }
    sub { bottom: -0.25em; }
    sup { top: -0.5em; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🧪 高中化學：化學平衡正式全卷測驗</h1>
      <p class="subtitle">全卷共 20 題 ｜ 每題作答後即鎖定並即時解析，作答完畢自動上傳試算表登記成績。</p>
    </header>

    <!-- 考生基本資料欄 -->
    <div class="student-card">
      <div class="info-group">
        <label for="studentClass">班級：</label>
        <input type="text" id="studentClass" placeholder="例如：高二甲班">
      </div>
      <div class="info-group">
        <label for="studentSeat">座號：</label>
        <input type="text" id="studentSeat" placeholder="例如：12">
      </div>
      <div class="info-group">
        <label for="studentName">姓名：</label>
        <input type="text" id="studentName" placeholder="請輸入姓名">
      </div>
    </div>

    <!-- 模式選擇卡片 -->
    <div id="modeCard" class="mode-card">
      <div class="mode-title">🎯 請先填妥上方學生資料，再選擇作答呈現模式：</div>
      <div class="mode-btns">
        <button type="button" class="btn-mode" onclick="startQuiz('stepwise')">
          ⚡ 漸進模式<br><small style="font-weight: normal;">(隨機出題，每次顯示 2 題逐步作答)</small>
        </button>
        <button type="button" class="btn-mode" onclick="startQuiz('all')">
          📋 全卷模式<br><small style="font-weight: normal;">(一次性展開完整 20 題)</small>
        </button>
      </div>
    </div>

    <!-- 頂部即時狀態統計 -->
    <div class="status-bar" id="statusBar">
      <div class="status-info">已作答：<span id="answeredCount">0</span> / <span id="totalCount">20</span> 題</div>
      <div class="status-info status-score">目前得分：<span id="scoreText">0</span> 分</div>
    </div>

    <form id="quizForm">
      <div id="questionsContainer"></div>
    </form>

    <!-- 漸進模式專用按鈕容器 -->
    <div id="loadMoreContainer" class="load-more-box" style="display: none;">
      <button type="button" id="btnLoadMore" class="btn-load-more" onclick="loadNextBatch()" disabled>
        🔒 請先作答完成目前題目再繼續
      </button>
    </div>

    <div id="uploadBanner" class="upload-banner"></div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxL8aghmYIWUVNeQRD9-4bXDAIVTZjd-5afQLoe1irKaFBM6VjTPE6yHvi-7PVTL6q/exec";

    // 20 題化學平衡題目資料庫
    const rawQuizData = [
      {
        id: 1,
        title: "25 ℃ 時，2Cl(g) ⇌ Cl2(g) 之 Kc＝1 × 10^38，若原有 [Cl]＝1 M，則平衡時 Cl2 之濃度為多少 M？",
        type: "single",
        options: [
          { key: "A", text: "0.1" },
          { key: "B", text: "0.5" },
          { key: "C", text: "1" },
          { key: "D", text: "10^-38" }
        ],
        answer: ["B"],
        explanation: "由 2Cl(g) ⇌ Cl2(g) 之 Kc 值極大，可知此反應向右進行非常完全，原有 [Cl]=1 M，完全反應時 [Cl2] ≈ 0.5 M。"
      },
      {
        id: 2,
        title: "氫和碘蒸氣各 1.6 mol 於 2.0 L 容器中反應生成碘化氫，若 350 ℃ 時的平衡常數為 36.0，則平衡時有關各反應物及產物的濃度，哪些是正確的？",
        type: "multiple",
        options: [
          { key: "A", text: "[H2]＝0.1 M" },
          { key: "B", text: "[I2]＝0.2 M" },
          { key: "C", text: "[HI]＝1.2 M" },
          { key: "D", text: "[H2]＝1.2 M" },
          { key: "E", text: "[HI]＝0.2 M" }
        ],
        answer: ["B", "C"],
        explanation: "初濃度 [H2]=[I2]=1.6/2.0=0.8 M。反應式 H2 + I2 ⇌ 2HI，平衡時 [H2]=[I2]=0.8-x，[HI]=2x。(2x)^2 / (0.8-x)^2 = 36 ⇒ x = 0.6。平衡時 [H2]=[I2]=0.2 M，[HI]=1.2 M。"
      },
      {
        id: 3,
        title: "下列各平衡系中，何者的平衡常數會隨溫度升高而變大？",
        type: "multiple",
        options: [
          { key: "A", text: "N2O4(g) ⇌ 2NO2(g)" },
          { key: "B", text: "Cl2(g) ⇌ 2Cl(g)" },
          { key: "C", text: "N2(g) + 3H2(g) ⇌ 2NH3(g)" },
          { key: "D", text: "H+(aq) + OH-(aq) ⇌ H2O(l)" },
          { key: "E", text: "NaNO3(s) ⇌ NaNO2(s) + 1/2 O2(g)" }
        ],
        answer: ["A", "B", "E"],
        explanation: "吸熱反應（ΔH > 0）升溫時平衡向吸熱方向移動，平衡常數增大。(A)(B)(E)均為吸熱反應；(C)合成氨放熱；(D)酸鹼中和放熱。"
      },
      {
        id: 4,
        title: "A2B4 ⇌ 2AB2 的反應熱為 ΔH，平衡常數為 K，在同溫時，反應 AB2 ⇌ 1/2 A2B4，反應熱（ΔH'）及平衡常數（K'）應各為何？",
        type: "multiple",
        options: [
          { key: "A", text: "K'＝1 / K" },
          { key: "B", text: "ΔH'＝ΔH" },
          { key: "C", text: "ΔH'＝-1/2 ΔH" },
          { key: "D", text: "K'＝K" },
          { key: "E", text: "(K')^2＝1 / K" }
        ],
        answer: ["C", "E"],
        explanation: "原反應逆向並乘以 1/2。因此 ΔH' = -1/2 ΔH，K' = (1/K)^(1/2)，即 (K')^2 = 1/K。"
      },
      {
        id: 5,
        title: "下列有關平衡常數表示式的敘述中，何者不正確？",
        type: "multiple",
        options: [
          { key: "A", text: "Hg2Cl2(s) 之 Ksp＝[Hg+]^2 [Cl-]^2" },
          { key: "B", text: "NH3(aq) + H2O(l) ⇌ NH4+(aq) + OH-(aq) 之 Kc＝([NH4+][OH-]) / ([NH3][H2O])" },
          { key: "C", text: "2HgO(s) ⇌ 2Hg(l) + O2(g) 之 Kc＝[O2]" },
          { key: "D", text: "CO(g) + 3H2(g) ⇌ CH4(g) + H2O(g) 之 Kc＝([CH4][H2O]) / ([CO][H2])" },
          { key: "E", text: "C2H5OH(l) ⇌ C2H5OH(g) 之 Kc＝1 / [C2H5OH(g)]" }
        ],
        answer: ["A", "B", "D", "E"],
        explanation: "(A) Hg2Cl2(s) ⇌ Hg2^2+ + 2Cl-，Ksp = [Hg2^2+][Cl-]^2；(B) 水為溶劑不列入表示式；(D) 應為 Kc = [CH4][H2O] / ([CO][H2]^3)；(E) 應為 Kc = [C2H5OH(g)]。"
      },
      {
        id: 6,
        title: "下列平衡系，何者 Kp 與 Kc 之數值與單位無關（即 Kp ＝ Kc）？",
        type: "multiple",
        options: [
          { key: "A", text: "CO(g) + 1/2 O2(g) ⇌ CO2(g)" },
          { key: "B", text: "C2H4(g) + H2(g) ⇌ C2H6(g)" },
          { key: "C", text: "H2(g) + F2(g) ⇌ 2HF(g)" },
          { key: "D", text: "N2(g) + 3F2(g) ⇌ 2NF3(g)" },
          { key: "E", text: "H2O(g) + CO(g) ⇌ H2(g) + CO2(g)" }
        ],
        answer: ["C", "E"],
        explanation: "Kp = Kc(RT)^Δn，當氣體前後莫耳數差 Δn = 0 時，Kp = Kc。(C) Δn = 2-(1+1)=0；(E) Δn = (1+1)-(1+1)=0。"
      },
      {
        id: 7,
        title: "定溫下，當 A(aq) + 3B(aq) ⇌ 2C(aq) 達平衡時，下列敘述何者正確？",
        type: "multiple",
        options: [
          { key: "A", text: "A、B、C 三者濃度皆維持不變" },
          { key: "B", text: "正反應速率＝逆反應速率＝0" },
          { key: "C", text: "A 的消耗速率＝B 的消耗速率＝C 的生成速率" },
          { key: "D", text: "A、B、C 的莫耳數比 nA：nB：nC＝1：3：2" },
          { key: "E", text: "[C]^2 / ([A][B]^3) 為定值" }
        ],
        answer: ["A", "E"],
        explanation: "平衡時動態平衡正逆反應速率相等且不為0；濃度維持定值；反應商等於平衡常數為定值。"
      },
      {
        id: 8,
        title: "在 1000 K 時，反應 CaCO3(s) ⇌ CaO(s) + CO2(g) 達平衡時 PCO2＝0.04 atm；同溫時，C(s) + CO2(g) ⇌ 2CO(g) 之 Kp＝1.96 atm。若將足量 C(s)、CaO(s) 和 CaCO3(s) 置於密閉容器，於 1000 K 達平衡時，下列何者正確？",
        type: "multiple",
        options: [
          { key: "A", text: "PCO2 ＜ 0.04 atm" },
          { key: "B", text: "PCO＝0.28 atm" },
          { key: "C", text: "C(s) 的量較開始反應時少" },
          { key: "D", text: "CaO(s) 的量較開始反應時少" },
          { key: "E", text: "CaCO3(s) 的量較開始反應時少" }
        ],
        answer: ["B", "C", "E"],
        explanation: "足量 CaCO3 與 CaO 存在時 PCO2 恆等於 0.04 atm。(PCO)^2 / 0.04 = 1.96 ⇒ PCO = 0.28 atm。反應進行消耗 C 與 CaCO3。"
      },
      {
        id: 9,
        title: "下列平衡系中，各物質的濃度或壓力單位，不論以 mol L^-1 或 mmHg 表示，其平衡常數的數值均相同的為何？",
        type: "multiple",
        options: [
          { key: "A", text: "2SO2(g) + O2(g) ⇌ 2SO3(g)" },
          { key: "B", text: "PCl5(g) ⇌ PCl3(g) + Cl2(g)" },
          { key: "C", text: "H2(g) + I2(g) ⇌ 2HI(g)" },
          { key: "D", text: "N2(g) + 2O2(g) ⇌ 2NO2(g)" },
          { key: "E", text: "CH4(g) + 2O2(g) ⇌ CO2(g) + 2H2O(g)" }
        ],
        answer: ["C", "E"],
        explanation: "氣體生成物與反應物係數和相同時（Δn = 0），平衡常數無因次，數值不受單位換算影響。"
      },
      {
        id: 10,
        title: "某反應：aA(s) + bB(g) ⇌ cC(g) 達到平衡時，溫度升高時 C 的體積百分率下降；在同溫下壓力 P1 ＞ P2 時，高壓 P1 的 C 體積百分率較大。由此可判斷何者正確？",
        type: "multiple",
        options: [
          { key: "A", text: "此為放熱反應" },
          { key: "B", text: "此為吸熱反應" },
          { key: "C", text: "a + b ＜ c" },
          { key: "D", text: "a + b ＞ c" },
          { key: "E", text: "b ＞ c" }
        ],
        answer: ["A", "D", "E"],
        explanation: "升溫使 C% 下降代表正反應放熱；加壓使平衡向氣體分子數較小方向移動，高壓 C% 大代表 b > c。因 a 為固體，故 a+b > c。"
      },
      {
        id: 11,
        title: "設 A(g) + B(g) ⇌ 3C(g) 於 25 ℃ 時 Kc＝2，則在該溫度下 5 L 之容器中各置入下列物質，何者會趨向正反應？",
        type: "multiple",
        options: [
          { key: "A", text: "A、B、C 各 2 mol" },
          { key: "B", text: "A、B、C 分別為 1、2、3 mol" },
          { key: "C", text: "A、B、C 分別為 2、2、3 mol" },
          { key: "D", text: "A、B、C 分別為 2、1、2 mol" },
          { key: "E", text: "A、B、C 分別為 2、1、3 mol" }
        ],
        answer: ["A", "C", "D"],
        explanation: "Q = [C]^3 / ([A][B]) = (nC^3 / (nA*nB)) * (1/5)。(A) Q=0.4 < 2 向右；(B) Q=2.7 > 2 向左；(C) Q=1.35 < 2 向右；(D) Q=0.8 < 2 向右；(E) Q=2.7 > 2 向左。"
      },
      {
        id: 12,
        title: "平衡常數的大小，會受下列何種因素的影響？",
        type: "multiple",
        options: [
          { key: "A", text: "反應的溫度" },
          { key: "B", text: "反應物及產物的濃度" },
          { key: "C", text: "反應容器的形狀與大小" },
          { key: "D", text: "觸媒" },
          { key: "E", text: "溶劑" }
        ],
        answer: ["A", "E"],
        explanation: "平衡常數僅與反應本性、溫度以及溶劑種類有關。濃度、容器大小形狀、觸媒均不影響平衡常數。"
      },
      {
        id: 13,

        type: "multiple",

        answer: ["B", "E"],

        title: "3.2 × 10^-2 M Fe(NO3)3(aq) 與 2 × 10^-3 M KSCN(aq) 各 10 mL 相混合達成平衡後，與 1.0 × 10^-3 M FeSCN^2+(aq) 標準液比色，當顏色深淺一樣時得 h標準：h未加＝7：10，求 Fe3+ + SCN- ⇌ FeSCN^2+ 之 K 值約為：",

        options: [
          { key: "A", text: "356" },

        explanation: "比色法 c1*h1=c2*h2，平衡 [FeSCN^2+] = 7.0 × 10^-4 M。各取 10 mL 稀釋後初濃度：[Fe3+]初 = 1.6 × 10^-2 M，[SCN-]初 = 1.0 × 10^-3 M。平衡時 [Fe3+] = 1.53 × 10^-2 M，[SCN-] = 3.0 × 10^-4 M。K ≈ 153。"

    // 化學符號上下標自動美化器
    function formatChem(str) {
      if (!str) return '';
      return str
        .replace(/\bKc\b/g, '<i>K</i><sub>c</sub>')
        .replace(/\bKp\b/g, '<i>K</i><sub>p</sub>')
        .replace(/\bKsp\b/g, '<i>K</i><sub>sp</sub>')
        .replace(/\bK\b/g, '<i>K</i>')
        .replace(/H\+/g, 'H<sup>+</sup>')
        .replace(/OH\-/g, 'OH<sup>-</sup>')
        .replace(/Ag\+/g, 'Ag<sup>+</sup>')
        .replace(/Cl\-/g, 'Cl<sup>-</sup>')
        .replace(/Ba2\+/g, 'Ba<sup>2+</sup>')
        .replace(/Fe3\+/g, 'Fe<sup>3+</sup>')
        .replace(/SCN\-/g, 'SCN<sup>-</sup>')
        .replace(/FeSCN2\+/g, 'FeSCN<sup>2+</sup>')
        .replace(/CrO4\^?2\-/g, 'CrO<sub>4</sub><sup>2-</sup>')
        .replace(/NH4\+/g, 'NH<sub>4</sub><sup>+</sup>')
        .replace(/Hg2\^?2\+/g, 'Hg<sub>2</sub><sup>2+</sup>')
        .replace(/10\^(-?\d+)/g, '10<sup>$1</sup>')
        .replace(/PCO2/g, 'P<sub>CO<sub>2</sub></sub>')
        .replace(/PCO/g, 'P<sub>CO</sub>')
        .replace(/([A-Za-z\)])(\d+)/g, function(match, p1, p2) {
          return p1 + '<sub>' + p2 + '</sub>';
        });
    }

    let activeQuizList = [];
    let currentRenderIndex = 0;
    let selectedMode = '';
    const statusMap = {};
    const detailRecords = {};
    let isUploaded = false;

    // 洗牌演算法 (Fisher-Yates)
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 檢查基本資料
    function checkStudentInfo() {
      const sClass = document.getElementById('studentClass').value.trim();
      const sSeat = document.getElementById('studentSeat').value.trim();
      const sName = document.getElementById('studentName').value.trim();

      if (!sClass || !sSeat || !sName) {
        alert('請先填寫「班級」、「座號」與「姓名」！');
        return false;
      }
      document.getElementById('studentClass').disabled = true;
      document.getElementById('studentSeat').disabled = true;
      document.getElementById('studentName').disabled = true;
      return true;
    }

    // 開始測驗
    function startQuiz(mode) {
      if (!checkStudentInfo()) return;

      selectedMode = mode;
      document.getElementById('modeCard').style.display = 'none';
      document.getElementById('statusBar').style.display = 'flex';

      if (mode === 'stepwise') {
        // 隨機抽題打散順序
        activeQuizList = shuffle(rawQuizData);
        currentRenderIndex = 0;
        document.getElementById('loadMoreContainer').style.display = 'block';
        loadNextBatch(); // 載入前 2 題
      } else {
        // 直接展開全部 20 題
        activeQuizList = [...rawQuizData];
        renderBatch(activeQuizList, 0);
        currentRenderIndex = activeQuizList.length;
      }
    }

    // 渲染特定題目陣列至畫面上
    function renderBatch(items, startIndex) {
      const container = document.getElementById('questionsContainer');

      items.forEach((q, offset) => {
        const displayIndex = startIndex + offset + 1;
        const isSingle = q.type === 'single';
        const inputType = isSingle ? 'radio' : 'checkbox';
        const typeBadge = isSingle ? '單選題' : '多選題';

        let optionsHtml = '';
        q.options.forEach(opt => {
          const changeHandler = isSingle ? `onchange="submitAndLock(${q.id})"` : '';
          optionsHtml += `
            <label class="option-label" id="label_${q.id}_${opt.key}">
              <input type="${inputType}" name="q_${q.id}" value="${opt.key}" ${changeHandler}>
              <span><strong>(${opt.key})</strong> ${formatChem(opt.text)}</span>
            </label>
          `;
        });

        const actionButton = !isSingle
          ? `<button type="button" id="btn_${q.id}" class="btn-submit-q" onclick="submitAndLock(${q.id})">確定送出本題（鎖定）</button>`
          : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card_${q.id}`;
        card.innerHTML = `
          <div class="q-title">
            <span class="q-type">${typeBadge}</span>
            <span id="locked_badge_${q.id}"></span>
            第 ${displayIndex} 題：${formatChem(q.title)}
          </div>
          <div class="options">${optionsHtml}</div>
          ${actionButton}
          <div class="result-box" id="result_${q.id}"></div>
        `;
        container.appendChild(card);
      });

      checkLoadMoreAvailability();
    }

    // 漸進模式：繼續顯示下 2 題
    function loadNextBatch() {
      const batchSize = 2;
      const nextBatch = activeQuizList.slice(currentRenderIndex, currentRenderIndex + batchSize);
      if (nextBatch.length > 0) {
        renderBatch(nextBatch, currentRenderIndex);
        currentRenderIndex += nextBatch.length;
      }
      checkLoadMoreAvailability();
    }

    // 檢查「繼續加載」按鈕是否解鎖
    function checkLoadMoreAvailability() {
      if (selectedMode !== 'stepwise') return;

      const btn = document.getElementById('btnLoadMore');
      if (currentRenderIndex >= activeQuizList.length) {
        // 題目已全部出完
        btn.disabled = true;
        btn.innerText = '🎉 全部 20 題已出完，請確認全卷完成';
        return;
      }

      // 檢查目前已渲染出來的題目是否全部都作答鎖定了
      const renderedQuestions = activeQuizList.slice(0, currentRenderIndex);
      const allRenderedAnswered = renderedQuestions.every(q => statusMap[q.id] !== undefined);

      if (allRenderedAnswered) {
        btn.disabled = false;
        btn.innerText = `➕ 繼續挑戰下 2 題 (目前 ${currentRenderIndex} / 20)`;
        btn.style.background = '#2563eb';
      } else {
        btn.disabled = true;
        btn.innerText = '🔒 請先作答完成目前題目再繼續';
        btn.style.background = '#94a3b8';
      }
    }

    // 作答並鎖定題目
    function submitAndLock(id) {
      if (statusMap[id] !== undefined) return;

      const q = rawQuizData.find(item => item.id === id);
      if (!q) return;

      const checkedInputs = document.querySelectorAll(`input[name="q_${id}"]:checked`);
      const userAnswers = Array.from(checkedInputs).map(i => i.value).sort();
      const correctAnswers = [...q.answer].sort();

      const resultBox = document.getElementById(`result_${id}`);

      if (userAnswers.length === 0) {
        alert('請先勾選答案再送出本題！');
        return;
      }

      // 鎖定選項
      const allInputs = document.querySelectorAll(`input[name="q_${id}"]`);
      allInputs.forEach(input => input.disabled = true);
      q.options.forEach(opt => {
        const label = document.getElementById(`label_${id}_${opt.key}`);
        if (label) label.classList.add('disabled');
      });

      const submitBtn = document.getElementById(`btn_${id}`);
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.style.display = 'none';
      }

      const lockBadge = document.getElementById(`locked_badge_${id}`);
      if (lockBadge) {
        lockBadge.className = 'locked-badge';
        lockBadge.innerText = '已鎖定';
      }

      // 判斷對錯
      const isCorrect = userAnswers.length === correctAnswers.length &&
                        userAnswers.every((val, index) => val === correctAnswers[index]);

      resultBox.style.display = 'block';
      if (isCorrect) {
        resultBox.className = 'result-box result-correct';
        resultBox.innerHTML = `
          <strong>✔ 答對了！</strong> 正確答案：(${correctAnswers.join(', ')})
          <div class="explanation"><strong>💡 解題步驟與觀念：</strong><br>${formatChem(q.explanation)}</div>
        `;
      } else {
        resultBox.className = 'result-box result-wrong';
        resultBox.innerHTML = `
          <strong>✖ 答錯了！</strong> 正確答案是：(${correctAnswers.join(', ')})<br>
          您的作答：(${userAnswers.join(', ')})
          <div class="explanation"><strong>💡 解題步驟與觀念：</strong><br>${formatChem(q.explanation)}</div>
        `;
      }

      statusMap[id] = isCorrect;
      detailRecords[`Q${id}`] = {
        userAnswers: userAnswers,
        correctAnswers: correctAnswers,
        isCorrect: isCorrect
      };

      updateStatus();
      checkLoadMoreAvailability();
    }

    // 更新狀態與計分
    function updateStatus() {
      const answeredKeys = Object.keys(statusMap);
      const answeredCount = answeredKeys.length;
      let correctCount = 0;

      answeredKeys.forEach(k => {
        if (statusMap[k]) correctCount++;
      });

      document.getElementById('answeredCount').innerText = answeredCount;
      const score = Math.round((correctCount / rawQuizData.length) * 100);
      document.getElementById('scoreText').innerText = score;

      // 20 題全部作答完畢時自動上傳
      if (answeredCount === rawQuizData.length && !isUploaded) {
        uploadResultsToSheet(score, correctCount, rawQuizData.length);
      }
    }

    // 上傳成績至 Google 試算表
    function uploadResultsToSheet(score, correctCount, totalCount) {
      isUploaded = true;
      const banner = document.getElementById('uploadBanner');
      banner.style.display = 'block';
      banner.style.color = '#2563eb';
      banner.innerText = '⏳ 全卷 20 題作答完畢，正在上傳成績至教師端試算表...';

      const payload = {
        studentClass: document.getElementById('studentClass').value.trim(),
        studentSeat: document.getElementById('studentSeat').value.trim(),
        studentName: document.getElementById('studentName').value.trim(),
        score: score,
        correctCount: correctCount,
        totalCount: totalCount,
        details: detailRecords
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        banner.style.color = '#16a34a';
        banner.innerText = '✅ 成績與作答紀錄已成功登錄至試算表！測驗圓滿完成。';
      })
      .catch((err) => {
        banner.style.color = '#dc2626';
        banner.innerText = '⚠️ 成績上傳失敗，請檢查網路連線或聯絡老師。';
      });
    }
  </script>
